# Git hooks, installed by `pnpm install` (see the `prepare` script in package.json).
# Docs: https://lefthook.dev/configuration/
# Keep these fast; clippy and the tests are CI's job (`just ready` runs everything locally).

pre-commit:
  parallel: true
  jobs:
    - name: rustfmt
      glob: "*.rs"
      run: cargo fmt --all
      stage_fixed: true

    - name: sync-readme
      glob: "{README.md,LICENSE,tasks/npm/sync-readme.mjs}"
      run: node tasks/npm/sync-readme.mjs && git add npm/oxcruise/README.md npm/oxcruise/LICENSE

    - name: oxfmt
      glob: "*.{js,mjs,cjs,ts,mts,cts}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
