name: ci

on:
  push:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Linux only, unless the head commit message starts with `[full-ci]`.
        os: ${{ fromJSON(startsWith(github.event.head_commit.message, '[full-ci]') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p oxcruise --lib --features napi -- -D warnings
      - run: cargo test --workspace

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec oxfmt --check '**/*.{js,mjs,cjs,ts,mts,cts}'
      - run: pnpm -C apps/oxcruise run build:binding:debug
      - run: pnpm -C apps/oxcruise run build:js
      - run: pnpm -C apps/oxcruise run typecheck
      - run: pnpm -C apps/oxcruise run test
      - run: node tasks/smoke/smoke.mjs

  generated-files-are-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo install just --locked
      - run: just config-ts
      - run: git diff --exit-code -- npm/oxcruise/configuration_schema.json apps/oxcruise/src-js
      - run: node tasks/npm/sync-readme.mjs
      - run: git diff --exit-code -- npm/oxcruise/README.md npm/oxcruise/LICENSE

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo install just --locked
      - run: just website-gen
      - run: git diff --exit-code -- website/src
      - run: just website-lint
      - run: pnpm -C website build

  visualizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/visualizer run typecheck
      - run: pnpm -C apps/visualizer run test
      - run: pnpm -C apps/visualizer run build
      - run: git diff --exit-code crates/oxcruise_visualize/assets
