[package]
name = "oxcruise_rules"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rule engine for oxcruise: built-in rules, declarative rules, suppression"

[features]
# Expose the `Tester` graph-fixture harness to other crates' tests.
testing = []
# Generate JSON schemas for rule options (website / `--rules`).
ruledocs = []

[lints]
workspace = true

[dependencies]
oxcruise_core = { workspace = true }
oxcruise_config = { workspace = true }
oxcruise_graph = { workspace = true }
oxcruise_macros = { workspace = true }
oxcruise_resolve = { workspace = true }
bitflags = { workspace = true }
globset = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
rustc-hash = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
oxcruise_rules = { path = ".", features = ["testing"] }
