[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/greeeg/oxcruise"
rust-version = "1.85"

[workspace.dependencies]
oxcruise_core = { path = "crates/oxcruise_core" }
oxcruise_extract = { path = "crates/oxcruise_extract" }
oxcruise_resolve = { path = "crates/oxcruise_resolve" }
oxcruise_graph = { path = "crates/oxcruise_graph" }
oxcruise_config = { path = "crates/oxcruise_config" }
oxcruise_macros = { path = "crates/oxcruise_macros" }
oxcruise_rules = { path = "crates/oxcruise_rules" }
oxcruise_report = { path = "crates/oxcruise_report" }

oxc_allocator = "0.155"
oxc_ast = "0.155"
oxc_ast_visit = "0.155"
oxc_parser = "0.155"
oxc_span = "0.155"
oxc_syntax = "0.155"
oxc_resolver = "11.24"

anyhow = "1"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
clap = { version = "4", features = ["derive"] }
bitflags = "2"
globset = "0.4"
ignore = "0.4"
insta = { version = "1", features = ["json", "yaml"] }
proptest = "1"
rayon = "1"
napi = { version = "3", default-features = false, features = ["napi9", "async", "tokio_rt", "serde-json"] }
napi-build = "2"
napi-derive = "3"
regex = "1"
rustc-hash = "2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 16
