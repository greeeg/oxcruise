[package]
name = "oxcruise"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Validate and visualise JS/TS dependency graphs. A fast, parallel dependency-cruiser alternative built on oxc."
publish = false

[lib]
name = "oxcruise"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "oxcruise"
path = "src/main.rs"
doc = false

[features]
default = []
# napi bindings and JS plugin host (filled in by the napi task).
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]
# mimalloc as the global allocator.
allocator = ["dep:mimalloc"]

[lints]
workspace = true

[dependencies]
oxcruise_core = { workspace = true }
oxcruise_config = { workspace = true }
oxcruise_graph = { workspace = true }
oxcruise_language_server = { workspace = true }
oxcruise_report = { workspace = true }
oxcruise_resolve = { workspace = true }
oxcruise_rules = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
napi = { workspace = true, optional = true }
napi-derive = { workspace = true, optional = true }
mimalloc = { version = "0.1", optional = true }

[build-dependencies]
napi-build = { workspace = true, optional = true }

[dev-dependencies]
lsp-server = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
